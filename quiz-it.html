<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Interaktif - Teknologi IT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ========== CONTAINER GLASS ========== */
    .container {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6);
      color: #f0f0ff;
      position: relative;
      overflow: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .container.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .info {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }

    .header .info .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* ========== TIMER ========== */
    .timer-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #34d399, #60a5fa);
      border-radius: 999px;
      transition: width 0.3s linear;
    }

    .timer-bar.warning {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
    }

    .timer-bar.danger {
      background: linear-gradient(90deg, #f87171, #ef4444);
      animation: pulse-bar 0.6s infinite;
    }

    @keyframes pulse-bar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .timer-text {
      text-align: right;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .timer-text span {
      font-weight: 700;
      color: #f0f0ff;
    }

    /* ========== SOAL ========== */
    .quiz-area {
      position: relative;
      min-height: 320px;
    }

    .slide {
      animation: slideIn 0.4s ease forwards;
    }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .slide-out {
      animation: slideOut 0.35s ease forwards;
    }

    @keyframes slideOut {
      0% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-40px); }
    }

    .question-number {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* ========== OPSI ========== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #f0f0ff;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: inherit;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(167, 139, 250, 0.4);
      transform: translateX(4px);
    }

    .option-btn .letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: rgba(52, 211, 153, 0.2);
      border-color: #34d399;
      animation: pop 0.35s ease;
    }

    .option-btn.wrong {
      background: rgba(248, 113, 113, 0.2);
      border-color: #f87171;
      animation: shake 0.4s ease;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .option-btn.correct .letter {
      background: #34d399;
      color: #0f0c29;
    }

    .option-btn.wrong .letter {
      background: #f87171;
      color: #0f0c29;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* ========== FEEDBACK ========== */
    .feedback-bar {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      animation: fadeUp 0.3s ease;
    }

    .feedback-bar.correct {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .feedback-bar.wrong {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #f87171;
    }

    .feedback-bar.timeout {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ========== TOMBOL NEXT ========== */
    .next-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: white;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: none;
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
    }

    .next-btn:active {
      transform: translateY(0);
    }

    /* ========== SCORE SCREEN ========== */
    .score-screen {
      text-align: center;
      padding: 20px 0;
    }

    .score-screen .big-score {
      font-size: 72px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    .score-screen .label {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }

    .score-screen .sub-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 24px;
    }

    .score-screen .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .score-screen .btn-group button {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .score-screen .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: white;
    }

    .score-screen .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
    }

    .score-screen .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f0f0ff;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .score-screen .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* ========== LEADERBOARD ========== */
    .leaderboard-section {
      margin-top: 28px;
      text-align: left;
    }

    .leaderboard-section h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .leaderboard-section h3::before {
      content: '🏆';
      font-size: 20px;
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .lb-table th {
      text-align: left;
      padding: 8px 10px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .lb-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .lb-table tr:first-child td {
      color: #fbbf24;
      font-weight: 700;
    }

    .lb-table .rank {
      width: 32px;
      text-align: center;
      font-weight: 700;
    }

    .lb-table .rank-1 { color: #ffd700; }
    .lb-table .rank-2 { color: #c0c0c0; }
    .lb-table .rank-3 { color: #cd7f32; }

    .lb-empty {
      text-align: center;
      padding: 24px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 14px;
    }

    .clear-lb-btn {
      margin-top: 10px;
      padding: 6px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .clear-lb-btn:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.3);
    }

    /* ========== KONFETTI ========== */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1000;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 20px;
      border-radius: 2px;
      top: -30px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg) scale(0.5);
        opacity: 0;
      }
    }

    /* ========== NAMA INPUT ========== */
    .name-input-area {
      margin-bottom: 24px;
      text-align: center;
    }

    .name-input-area label {
      display: block;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }

    .name-input-area input {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #f0f0ff;
      font-size: 16px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      outline: none;
      transition: border-color 0.25s;
      font-family: inherit;
    }

    .name-input-area input:focus {
      border-color: #7c3aed;
    }

    .name-input-area .start-btn {
      margin-top: 14px;
      padding: 14px 48px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: white;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .name-input-area .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
    }

    .name-input-area .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 500px) {
      .container {
        padding: 20px 16px;
        border-radius: 20px;
      }
      .header h1 { font-size: 18px; }
      .question-text { font-size: 16px; }
      .option-btn { font-size: 14px; padding: 12px 14px; }
      .score-screen .big-score { font-size: 52px; }
    }
  </style>
</head>
<body>

  <div class="container" id="appContainer">

    <!-- ===== START SCREEN ===== -->
    <div id="startScreen">
      <div style="text-align:center;padding:20px 0;">
        <div style="font-size:64px;margin-bottom:8px;">🧠</div>
        <h1 style="font-size:24px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
          Quiz Teknologi IT
        </h1>
        <p style="color:rgba(255,255,255,0.5);font-size:14px;margin-bottom:20px;">
          Uji pengetahuanmu tentang dunia teknologi informasi!
        </p>
        <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:20px;">
          <span>📝 20 Soal</span>
          <span>⏱️ 15 detik/soal</span>
          <span>🏆 Leaderboard</span>
        </div>
      </div>

      <div class="name-input-area">
        <label>Masukkan namamu untuk memulai:</label>
        <input type="text" id="playerNameInput" placeholder="Nama pemain..." maxlength="20" />
        <br/>
        <button class="start-btn" id="startBtn" disabled>Mulai Quiz</button>
      </div>

      <!-- Leaderboard di awal -->
      <div id="startLeaderboard"></div>
    </div>

    <!-- ===== QUIZ SCREEN ===== -->
    <div id="quizScreen" style="display:none;">
      <div class="header">
        <h1>🧠 Quiz IT</h1>
        <div class="info">
          <span class="badge" id="questionCounter">1/20</span>
          <span class="badge" id="scoreDisplay">Skor: 0</span>
        </div>
      </div>

      <div class="timer-text">⏱️ Waktu: <span id="timerDisplay">15</span> detik</div>
      <div class="timer-wrap">
        <div class="timer-bar" id="timerBar"></div>
      </div>

      <div class="quiz-area" id="quizArea">
        <div class="question-number" id="questionNumber">Soal #1</div>
        <div class="question-text" id="questionText">Memuat soal...</div>
        <div class="options" id="optionsContainer"></div>
        <div id="feedbackContainer"></div>
        <button class="next-btn" id="nextBtn">Soal Selanjutnya →</button>
      </div>
    </div>

    <!-- ===== SCORE SCREEN ===== -->
    <div id="scoreScreen" style="display:none;">
      <div class="score-screen">
        <div class="big-score" id="finalScore">0</div>
        <div class="label" id="finalLabel">Skor Akhir</div>
        <div class="sub-label" id="finalSubLabel">0 dari 20 soal benar</div>

        <div class="btn-group">
          <button class="btn-primary" id="playAgainBtn">🔄 Main Lagi</button>
          <button class="btn-secondary" id="leaderboardBtn">🏆 Lihat Leaderboard</button>
        </div>

        <div class="leaderboard-section" id="scoreLeaderboard"></div>
      </div>
    </div>

  </div>

  <div class="confetti-container" id="confettiContainer"></div>

  <script>
    // ============================================================
    //  DATA SOAL — 20 Soal Teknologi IT Bahasa Indonesia
    // ============================================================
    const QUESTIONS = [
      {
        question: 'Apa kepanjangan dari "CPU"?',
        options: ['Central Processing Unit', 'Computer Personal Unit', 'Central Program Utility', 'Core Processing Unit'],
        answer: 0
      },
      {
        question: 'Bahasa pemrograman apa yang dikenal sebagai "bahasa induk" dari kebanyakan bahasa modern?',
        options: ['Java', 'Python', 'C', 'JavaScript'],
        answer: 2
      },
      {
        question: 'Apa yang dimaksud dengan "RAM" pada komputer?',
        options: ['Memori penyimpanan permanen', 'Memori akses acak untuk menyimpan data sementara', 'Perangkat input/output', 'Unit pemrosesan grafis'],
        answer: 1
      },
      {
        question: 'Siapa yang dianggap sebagai "Bapak Komputer"?',
        options: ['Bill Gates', 'Alan Turing', 'Charles Babbage', 'Steve Jobs'],
        answer: 2
      },
      {
        question: 'Apa fungsi utama dari sistem operasi?',
        options: ['Menjalankan aplikasi game', 'Mengelola sumber daya hardware dan software komputer', 'Menyambungkan internet', 'Mengedit foto'],
        answer: 1
      },
      {
        question: 'Apa singkatan dari "URL"?',
        options: ['Universal Resource Locator', 'Uniform Resource Locator', 'Unified Resource Link', 'Universal Reference Link'],
        answer: 1
      },
      {
        question: 'Dalam jaringan komputer, apa kepanjangan dari "LAN"?',
        options: ['Large Area Network', 'Local Area Network', 'Logical Access Node', 'Long-range Access Network'],
        answer: 1
      },
      {
        question: 'Apa itu "firewall" dalam dunia IT?',
        options: ['Tembok api fisik pelindung server', 'Sistem keamanan yang memonitor dan mengontrol lalu lintas jaringan', 'Alat untuk memadamkan kebakaran di data center', 'Program untuk mempercepat koneksi internet'],
        answer: 1
      },
      {
        question: 'Bahasa pemrograman mana yang paling populer untuk pengembangan web front-end?',
        options: ['Python', 'Java', 'JavaScript', 'C++'],
        answer: 2
      },
      {
        question: 'Apa fungsi dari "database" dalam sebuah sistem?',
        options: ['Menyimpan koleksi file musik', 'Mengatur tampilan website', 'Menyimpan, mengelola, dan mengambil data secara terstruktur', 'Menjalankan program aplikasi'],
        answer: 2
      },
      {
        question: 'Apa itu "cloud computing"?',
        options: ['Komputer yang berbentuk awan', 'Teknologi yang menyediakan sumber daya IT melalui internet', 'Jaringan komputer tanpa kabel', 'Komputer yang digunakan BMKG'],
        answer: 1
      },
      {
        question: 'Kepanjangan dari "SSD" adalah...',
        options: ['Solid State Drive', 'Super Speed Disk', 'System Storage Device', 'Solid System Disk'],
        answer: 0
      },
      {
        question: 'Apa nama protokol yang digunakan untuk mengirim email?',
        options: ['HTTP', 'FTP', 'SMTP', 'TCP'],
        answer: 2
      },
      {
        question: 'Apa itu "algorithm" dalam pemrograman?',
        options: ['Jenis bahasa pemrograman', 'Langkah-langkah logis untuk menyelesaikan masalah', 'Perangkat keras komputer', 'Aplikasi pengolah kata'],
        answer: 1
      },
      {
        question: 'Tahun berapa komputer pribadi (PC) pertama diperkenalkan oleh IBM?',
        options: ['1975', '1981', '1985', '1990'],
        answer: 1
      },
      {
        question: 'Apa fungsi dari "GPU"?',
        options: ['Mengelola daya listrik', 'Memproses data grafis dan visual', 'Menyimpan data pengguna', 'Mengatur koneksi jaringan'],
        answer: 1
      },
      {
        question: 'Apa itu "phishing" dalam keamanan siber?',
        options: ['Teknik memancing ikan menggunakan komputer', 'Serangan siber yang menipu korban untuk memberikan data sensitif', 'Metode mempercepat koneksi', 'Aplikasi antivirus'],
        answer: 1
      },
      {
        question: 'Kepanjangan dari "HTML" adalah...',
        options: ['HyperText Markup Language', 'High Tech Modern Language', 'Home Tool Markup Language', 'HyperTransfer Markup Language'],
        answer: 0
      },
      {
        question: 'Apa yang dimaksud dengan "open source"?',
        options: ['Software yang dijual dengan harga murah', 'Software yang kode sumbernya dapat diakses, digunakan, dan dimodifikasi oleh publik', 'Software yang hanya berjalan di sistem operasi tertentu', 'Software yang tidak memerlukan lisensi'],
        answer: 1
      },
      {
        question: 'Siapa pendiri Microsoft?',
        options: ['Steve Jobs', 'Mark Zuckerberg', 'Bill Gates dan Paul Allen', 'Larry Page dan Sergey Brin'],
        answer: 2
      }
    ];

    // ============================================================
    //  STATE
    // ============================================================
    const state = {
      questions: QUESTIONS,
      currentIndex: 0,
      score: 0,
      playerName: '',
      timer: 15,
      timerInterval: null,
      isAnswering: true,
      answered: false,
    };

    // ============================================================
    //  DOM REFS
    // ============================================================
    const $ = id => document.getElementById(id);
    const startScreen = $('startScreen');
    const quizScreen = $('quizScreen');
    const scoreScreen = $('scoreScreen');
    const playerNameInput = $('playerNameInput');
    const startBtn = $('startBtn');
    const questionCounter = $('questionCounter');
    const scoreDisplay = $('scoreDisplay');
    const timerDisplay = $('timerDisplay');
    const timerBar = $('timerBar');
    const questionNumber = $('questionNumber');
    const questionText = $('questionText');
    const optionsContainer = $('optionsContainer');
    const feedbackContainer = $('feedbackContainer');
    const nextBtn = $('nextBtn');
    const finalScore = $('finalScore');
    const finalLabel = $('finalLabel');
    const finalSubLabel = $('finalSubLabel');
    const playAgainBtn = $('playAgainBtn');
    const leaderboardBtn = $('leaderboardBtn');
    const startLeaderboard = $('startLeaderboard');
    const scoreLeaderboard = $('scoreLeaderboard');
    const confettiContainer = $('confettiContainer');

    // ============================================================
    //  LEADERBOARD (localStorage)
    // ============================================================
    function getLeaderboard() {
      try {
        return JSON.parse(localStorage.getItem('quizIT_leaderboard')) || [];
      } catch { return []; }
    }

    function saveToLeaderboard(name, score, total) {
      const lb = getLeaderboard();
      lb.push({ name, score, total, date: new Date().toISOString().slice(0, 10) });
      lb.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
      if (lb.length > 20) lb.length = 20; // max 20 entries
      localStorage.setItem('quizIT_leaderboard', JSON.stringify(lb));
    }

    function clearLeaderboard() {
      localStorage.removeItem('quizIT_leaderboard');
      renderAllLeaderboards();
    }

    function renderLeaderboard(containerId, limit = 10) {
      const container = typeof containerId === 'string' ? $(containerId) : containerId;
      if (!container) return;
      const lb = getLeaderboard();
      if (lb.length === 0) {
        container.innerHTML = `<div class="lb-empty">Belum ada skor. Jadilah yang pertama! 🚀</div>`;
        return;
      }
      let html = `<div class="leaderboard-section"><h3>🏆 Leaderboard</h3>`;
      if (containerId === 'scoreLeaderboard' || containerId === 'startLeaderboard') {
        html += `<button class="clear-lb-btn" onclick="clearLeaderboard()">🗑️ Hapus Semua</button>`;
      }
      html += `<table class="lb-table">
        <tr><th></th><th>Nama</th><th>Skor</th><th>Tanggal</th></tr>`;
      const top = lb.slice(0, limit);
      top.forEach((entry, i) => {
        const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        html += `<tr>
          <td class="rank ${rankClass}">${medal || (i+1)}</td>
          <td>${escapeHtml(entry.name)}</td>
          <td><strong>${entry.score}</strong>/${entry.total}</td>
          <td style="color:rgba(255,255,255,0.3);font-size:12px;">${entry.date}</td>
        </tr>`;
      });
      html += `</table></div>`;
      container.innerHTML = html;
    }

    function renderAllLeaderboards() {
      renderLeaderboard('startLeaderboard', 10);
      renderLeaderboard('scoreLeaderboard', 10);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ============================================================
    //  KONFETTI
    // ============================================================
    function launchConfetti(count = 120) {
      const colors = ['#a78bfa', '#60a5fa', '#34d399', '#fbbf24', '#f87171', '#f472b6', '#ffd700'];
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (Math.random() * 8 + 4) + 'px';
        piece.style.height = (Math.random() * 14 + 8) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
        piece.style.animationDelay = (Math.random() * 1.5) + 's';
        confettiContainer.appendChild(piece);
      }
      setTimeout(() => { confettiContainer.innerHTML = ''; }, 5000);
    }

    // ============================================================
    //  TIMER
    // ============================================================
    function startTimer() {
      state.timer = 15;
      updateTimerUI();
      state.timerInterval = setInterval(() => {
        state.timer--;
        updateTimerUI();
        if (state.timer <= 0) {
          clearInterval(state.timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function updateTimerUI() {
      timerDisplay.textContent = state.timer;
      const pct = (state.timer / 15) * 100;
      timerBar.style.width = pct + '%';
      timerBar.className = 'timer-bar';
      if (state.timer <= 5) timerBar.classList.add('danger');
      else if (state.timer <= 8) timerBar.classList.add('warning');
    }

    // ============================================================
    //  QUIZ LOGIC
    // ============================================================
    function loadQuestion(index) {
      const q = state.questions[index];
      questionNumber.textContent = `Soal #${index + 1}`;
      questionText.textContent = q.question;
      questionCounter.textContent = `${index+1}/${state.questions.length}`;
      scoreDisplay.textContent = `Skor: ${state.score}`;

      optionsContainer.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="letter">${letters[i]}</span>${escapeHtml(opt)}`;
        btn.dataset.index = i;
        btn.addEventListener('click', () => handleAnswer(i));
        optionsContainer.appendChild(btn);
      });

      feedbackContainer.innerHTML = '';
      nextBtn.style.display = 'none';
      state.isAnswering = true;
      state.answered = false;

      // animate
      const quizArea = $('quizArea');
      quizArea.classList.remove('slide-out');
      quizArea.classList.add('slide');
    }

    function handleAnswer(selectedIndex) {
      if (!state.isAnswering || state.answered) return;
      state.answered = true;
      state.isAnswering = false;
      stopTimer();

      const q = state.questions[state.currentIndex];
      const btns = optionsContainer.querySelectorAll('.option-btn');
      const isCorrect = selectedIndex === q.answer;

      // disable all
      btns.forEach(b => b.disabled = true);

      // highlight correct
      btns[q.answer].classList.add('correct');

      if (isCorrect) {
        state.score++;
        scoreDisplay.textContent = `Skor: ${state.score}`;
        feedbackContainer.innerHTML = `<div class="feedback-bar correct">✅ Benar! Jawaban: ${q.options[q.answer]}</div>`;
      } else {
        btns[selectedIndex].classList.add('wrong');
        feedbackContainer.innerHTML = `<div class="feedback-bar wrong">❌ Salah! Jawaban yang benar: ${q.options[q.answer]}</div>`;
      }

      nextBtn.style.display = 'block';
      nextBtn.textContent = state.currentIndex === state.questions.length - 1 ? 'Lihat Hasil 🎯' : 'Soal Selanjutnya →';
    }

    function handleTimeout() {
      if (state.answered) return;
      state.answered = true;
      state.isAnswering = false;

      const q = state.questions[state.currentIndex];
      const btns = optionsContainer.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
      btns[q.answer].classList.add('correct');

      feedbackContainer.innerHTML = `<div class="feedback-bar timeout">⏰ Waktu habis! Jawaban: ${q.options[q.answer]}</div>`;
      nextBtn.style.display = 'block';
      nextBtn.textContent = state.currentIndex === state.questions.length - 1 ? 'Lihat Hasil 🎯' : 'Soal Selanjutnya →';
    }

    function goToNext() {
      state.currentIndex++;
      if (state.currentIndex >= state.questions.length) {
        showScoreScreen();
        return;
      }
      loadQuestion(state.currentIndex);
      startTimer();
    }

    // ============================================================
    //  SCREEN MANAGEMENT
    // ============================================================
    function showStartScreen() {
      startScreen.style.display = 'block';
      quizScreen.style.display = 'none';
      scoreScreen.style.display = 'none';
      renderAllLeaderboards();
      playerNameInput.value = '';
      startBtn.disabled = true;
    }

    function showQuizScreen() {
      startScreen.style.display = 'none';
      quizScreen.style.display = 'block';
      scoreScreen.style.display = 'none';
      state.currentIndex = 0;
      state.score = 0;
      loadQuestion(0);
      startTimer();
    }

    function showScoreScreen() {
      startScreen.style.display = 'none';
      quizScreen.style.display = 'none';
      scoreScreen.style.display = 'block';

      const total = state.questions.length;
      finalScore.textContent = state.score;
      finalSubLabel.textContent = `${state.score} dari ${total} soal benar`;

      const pct = (state.score / total) * 100;
      if (pct >= 90) finalLabel.textContent = '🌟 Luar Biasa!';
      else if (pct >= 70) finalLabel.textContent = '👍 Bagus!';
      else if (pct >= 50) finalLabel.textContent = '💪 Lumayan!';
      else finalLabel.textContent = '📚 Ayo belajar lagi!';

      // Simpan ke leaderboard
      if (state.playerName.trim()) {
        saveToLeaderboard(state.playerName.trim(), state.score, total);
      }

      renderAllLeaderboards();

      // Konfetti jika skor bagus
      if (pct >= 70) {
        setTimeout(() => launchConfetti(100), 200);
      } else if (pct >= 50) {
        setTimeout(() => launchConfetti(50), 200);
      }
    }

    // ============================================================
    //  EVENT LISTENERS
    // ============================================================
    playerNameInput.addEventListener('input', () => {
      const name = playerNameInput.value.trim();
      startBtn.disabled = name.length < 2;
    });

    startBtn.addEventListener('click', () => {
      const name = playerNameInput.value.trim();
      if (name.length < 2) return;
      state.playerName = name;
      showQuizScreen();
    });

    playerNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !startBtn.disabled) {
        startBtn.click();
      }
    });

    nextBtn.addEventListener('click', goToNext);

    playAgainBtn.addEventListener('click', () => {
      showStartScreen();
    });

    leaderboardBtn.addEventListener('click', () => {
      showStartScreen();
    });

    // Key shortcut: Enter to go next
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && nextBtn.style.display === 'block') {
        goToNext();
      }
    });

    // ============================================================
    //  INIT
    // ============================================================
    showStartScreen();
  </script>

</body>
</html>
